<section class="lab-hero wrap"><a class="back-link" href="__HOME__#labs">← {{lab.back}}</a><p class="eyebrow">Lab 01 · {{lab.code.name}}<span class="replay-badge">{{lab.replay}}</span></p><h1>{{lab.code.title}}</h1><p class="lede">{{lab.code.lede}}</p></section>
<section class="wrap lab-workspace"><div class="case-switch" role="group" aria-label="{{lab.code.cases}}"><button data-case="code-speed">{{lab.code.case_speed}}<span>27.45×</span></button><button data-case="code-repair">{{lab.code.case_repair}}<span>15 / 15</span></button></div><div id="lab-app" aria-live="polite"><div class="loading"><span></span>{{lab.loading}}</div></div></section>
<section class="wrap next-lab"><div><p class="eyebrow">{{lab.next}}</p><h2>{{lab.code.next}}</h2></div><a class="btn btn-ghost" href="__HOME__labs/experiments/">{{lab.code.next_cta}}<span aria-hidden="true">→</span></a></section>
