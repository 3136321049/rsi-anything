[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "rsi-anything"
version = "0.2.0.dev0"
description = "Point any coding agent at anything you can score. A git ratchet keeps only the changes a frozen judge proves better."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
training = ["scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
rsi = "rsi_anything.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_anything"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/scripts", "/tests", "/README.md", "/README.zh-CN.md", "/pyproject.toml", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
