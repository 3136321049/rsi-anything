[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-anything"
version = "0.1.0"
description = "Turn any measurable goal into a self-improving ratchet loop."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "RSI-Anything Contributors" }]
dependencies = []
keywords = ["agents", "rsi", "research", "evaluation", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
rsi = "rsi:main"

[tool.setuptools]
py-modules = ["rsi"]
packages = ["core"]
