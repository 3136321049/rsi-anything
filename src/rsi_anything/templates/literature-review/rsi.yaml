name: cognitive-offloading-review
goal: |
  为教育研究读书会写一篇关于“数字工具怎样改变我们记忆信息与信息位置”的中文资料综述。
  修改 review.md 和 evidence.json，只使用 judge/sources.json 的三份摘要。
  围绕一个问题综合比较实验、理论综述和政策建议，分清支持的结论与仍需研究的假设。
  每个来源使用 [S1] 等引用；evidence.json 中 claim 必须是正文的一句原话，sources 对应来源编号。
  至少三条证据映射并覆盖三个来源，不能把旧检索研究写成生成式AI的直接效果证明。
artifact: [review.md, evidence.json]
judge:
  type: rubric
  prepare: "{python} judge/prepare.py"
  rubric: judge/rubric.yaml
  files: [judge]
  inputs: [out/evaluation.md]
  models: [auto]
  samples: 1
  pairwise: true
  timeout: 600
outputs: [out]
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 60
  stagnation: 3
