name: cognitive-offloading-review
goal: |
  Write an English literature review for an education research reading group on "how digital tools change what we remember about information and where to find it".
  Revise review.md and evidence.json, using only the three summaries in judge/sources.json.
  Organize the review around one question and compare the experiment, the theoretical review and the policy guidance, separating supported conclusions from hypotheses that still need research.
  Cite each source as [S1] and so on; in evidence.json each claim must be a sentence copied word for word from the review, and sources lists the matching source ids.
  Give at least three evidence mappings covering all three sources, and do not present the older search-and-memory study as direct proof of the effects of generative AI.
artifact: [review.md, evidence.json]
judge:
  type: rubric
  prepare: "{python} judge/prepare.py"
  rubric: judge/rubric.yaml
  files: [judge]
  inputs: [out/evaluation.md]
  models: [auto]
  samples: 1
  pairwise: true
  timeout: 600
outputs: [out]
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 60
  stagnation: 3
