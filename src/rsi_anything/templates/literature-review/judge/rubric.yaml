task: |
  Organize three given sources for an education research reading group, discussing how digital tools change memory for content and memory for where information is.
  Judge whether the piece forms a bounded synthesis; rewriting the summaries one by one is not a high-quality review.
context: [judge/sources.json]
criteria:
  - name: question
    weight: 20
    question: Does it pose a clear question and a central claim that can be discussed?
    anchors: {1: only a topic label, 5: a question exists but the piece only lists sources, 8: the whole piece is organized around a clear question, 10: an insightful claim that every paragraph moves forward}
  - name: synthesis
    weight: 30
    question: Does it compare the links and differences between the sources and support its own synthesis with evidence?
    anchors: {1: three unconnected summaries, 5: mentions common ground but the relationships are vague, 8: separates memory for content from memory for location and explains the cognitive offloading framework, 10: draws well-grounded new questions from the differences without overstating}
  - name: evidence
    weight: 25
    question: Does it distinguish experimental findings, theoretical frameworks, policy guidance and the author's own inferences, and do the citations support the claims next to them?
    anchors: {1: decorative citations or misplaced evidence, 5: correct sources but blurred boundaries, 8: every important claim can be traced to its source and its limits, 10: explains on its own initiative why different kinds of evidence cannot stand in for each other}
  - name: research_gap
    weight: 15
    question: Does it point out questions the given sources cannot answer and propose researchable follow-up questions?
    anchors: {1: claims every effect has been proven, 5: only says more research is needed, 8: proposes specific populations, tasks or comparison conditions, 10: the follow-up questions can tell several competing explanations apart}
  - name: readability
    weight: 10
    question: Does it explain concepts for a reading group, with a coherent structure and no academic boilerplate?
    anchors: {1: a pile of jargon, 5: readable but with awkward transitions, 8: concepts explained and paragraphs connect naturally, 10: concise with a complete argument}
gates:
  min_chars: 1000
  max_chars: 24000
checks:
  - Invents no studies, experimental data, sample sizes, author quotations or conclusions beyond the given summaries.
  - Does not treat early search-and-memory experiments as direct evidence of the effects of modern generative AI.
  - Does not treat policy guidance as an experimental result; teaching suggestions or research questions proposed by the author are clearly marked as inferences.
