name: adult-activity-explainer
goal: |
  Improve explainer.md for generally healthy adults with desk jobs: explain the WHO physical activity recommendations and help readers understand them and get started.
  Use only judge/sources.json: moderate- to vigorous-intensity aerobic activity, muscle strengthening, reducing sedentary time, and starting small and building up gradually.
  Write the key quantities only as {{data key}} placeholders; the keys are in the values of judge/sources.json. Cite sources as [W1], [W2].
  You may use everyday examples, but do not write personal training prescriptions or add medication, diagnosis or promises of treating disease.
  Keep the statements that this is for generally healthy adults, that it is health education, and that it is not a substitute for individual medical advice.
artifact: [explainer.md]
judge:
  type: rubric
  prepare: "{python} judge/prepare.py"
  rubric: judge/rubric.yaml
  files: [judge]
  inputs: [out/evaluation.md]
  models: [auto]
  samples: 1
  pairwise: true
  timeout: 600
outputs: [out]
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 60
  stagnation: 3
