name: percent-lesson
goal: |
  Revise lesson.md so it explains to middle-school students percentages, percent change, recovering the original amount, successive changes, and the difference between percent and percentage points.
  You may change the structure, worked examples and step-by-step explanations; follow judge/brief.md, and do not copy the test questions or answers from judge/exercises.json.
  During scoring a restricted student model sees only the lesson and the questions, and must give an answer, its reasoning, and a supporting sentence quoted from the lesson; a program grades the answers against a fixed key.
artifact: [lesson.md]
judge:
  type: command
  run: "{python} judge/evaluate.py"
  files: [judge]
  direction: maximize
  min_delta: 1
  timeout: 900
outputs: [out]
agent: {use: auto, timeout: 600}
budget: {rounds: 6, minutes: 75, stagnation: 3}
