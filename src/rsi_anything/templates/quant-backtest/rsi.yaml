name: historical-sma-backtest
goal: |
  Change the moving-average windows, entry threshold and position size in strategy.json to improve the trade-off between return and drawdown on frozen historical data.
  fast_window is 2..60, slow_window is 5..120 and greater than fast_window, threshold_bps is 0..300, and allocation is 0.1..1.
  Long only or cash: the signal forms at the previous day's close and the order fills at the next day's open; trading costs and the evaluation period are fixed and cannot be changed.
  Score = cumulative return in percentage points - 1.5 x maximum drawdown in percentage points. At least one buy and one sell are required, and equity must stay finite and positive.
  Read the return, drawdown, costs and trade table in out/report.md before each attempt; this is a parameter optimization demo on fixed history, not investment advice or a promise of future returns.
artifact: [strategy.json]
outputs: [out]
judge:
  type: command
  run: "{python} judge/evaluate.py"
  files: [judge]
  min_delta: 0.1
  timeout: 60
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 45
  stagnation: 3
