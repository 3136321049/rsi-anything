name: design-contract-review
goal: |
  Review the entirely fictional design-services contract in judge/contract.json and revise review.json.
  Following the seven issue types in judge/review-guide.json, locate the clause, quote the original sentence, explain the possible dispute, and propose wording that can actually be used.
  Do not judge the validity of a real contract and do not bring in statutes, case law or jurisdictions; state clearly that this is an example exercise and not legal advice.
  issue_id uses the given issue ids and clause_id uses the contract clause ids; a suggestion can be draft clause wording for both parties to discuss.
artifact: [review.json]
judge:
  type: rubric
  prepare: "{python} judge/prepare.py"
  rubric: judge/rubric.yaml
  files: [judge]
  inputs: [out/evaluation.md]
  models: [auto]
  pairwise: true
  timeout: 600
outputs: [out]
agent: {use: auto, timeout: 600}
budget: {rounds: 6, minutes: 60, stagnation: 3}
