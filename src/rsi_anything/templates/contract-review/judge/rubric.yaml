task: |
  Work through the problems in the given synthetic contract using the authors' own review guide. A high-quality output tells both parties which sentence to change, why, and how to turn it into a clear agreement.
  This example does not judge legal validity and gives no real legal advice. The program's coverage record only confirms that clauses were located; it says nothing about the quality of the suggestions.
context: [judge/contract.json, judge/review-guide.json]
criteria:
  - name: coverage
    weight: 30
    question: Which of the seven preset issue types are covered? Is each key dispute fully explained rather than only named?
    anchors: {1: finds only one or two types and explains them poorly, 5: covers about half with real explanation, 8: covers nearly all seven and highlights the important ones, 10: complete coverage with clear boundaries between types and no repetition}
  - name: consequence
    weight: 25
    question: Is each risk tied closely to the original contract wording, and does it say what concrete disagreement could arise?
    anchors: {1: only says the risk is big, 5: generic but relevant explanation, 8: clearly explains the different readings and their practical consequences, 10: separates the two parties' concerns and points out what must be settled first}
  - name: revision
    weight: 30
    question: Are the suggested changes workable, stating the scope, trigger, timing or handling, and marking numbers that are not yet agreed?
    anchors: {1: only says "improve this", 5: has a direction but leaves key ambiguities, 8: specific, discussable and fixes the original problem, 10: complete, restrained draft clauses that fit with the other clauses}
  - name: presentation
    weight: 15
    question: Can a reader without legal training quickly find each problem, the original text and the next step?
    anchors: {1: lots of vague jargon, 5: readable but every item reads like the same template, 8: clear, concise and prioritized, 10: usable directly as a discussion checklist for both parties}
gates: {min_chars: 1000, max_chars: 40000}
checks:
  - Invents no statutes, case law or jurisdictions, and does not assert that the contract is certainly void, that a party will certainly win, or that a party has broken the law.
  - Quotes match the actual given clauses, and any new times or numbers proposed are clearly options for both parties to confirm, not facts of the original contract.
  - No suggestion transfers third-party intellectual property that the Designer does not control, and none widens the permitted use of customer data.
