task: |
  一篇小红书笔记，推广「夜航自习室」的夜间会员。读者是白天要上班或上课、只能晚上备考的人。
  好笔记要让这群人在信息流里停下来，相信这是真的，并知道下一步怎么做。
  事实以 judge/brief.md 为准，资料之外的价格、数字、评价、福利都算编造。

context: [judge/brief.md]   # 评审时一并提供给评委的冻结资料

criteria:
  - name: hook
    weight: 25
    question: 标题和开头两行，能否让「只能晚上学习的人」停下来？
    anchors: {1: 空泛口号或自夸, 5: 点到了人群但没有具体画面, 8: 具体场景让目标读者认出自己, 10: 一句话说中这群人的真实处境和顾虑，在信息流里明显比同类笔记更想点开}
  - name: concrete_value
    weight: 25
    question: 是否用资料里的具体细节（时间、价格、隔间设施、夜间福利、安全）回答「对我有什么用」？
    anchors: {1: 只有形容词, 5: 列了一些细节但像说明书, 8: 细节按读者的一个晚上组织起来, 10: 每个细节都回答了这群人的一个具体顾虑，读完不需要再问任何问题}
  - name: credibility
    weight: 20
    question: 读起来像真人分享还是硬广？有没有夸大、绝对化或资料外的信息？
    anchors: {1: 明显硬广或有编造, 5: 基本可信但有套话, 8: 克制真诚，几乎没有套话, 10: 像一位真实的熟客在分享，没有一句可删的客套}
  - name: platform_fit
    weight: 15
    question: 是否符合小红书的阅读习惯：短段落、要点清楚、表情和话题标签适度？
    anchors: {1: 大段文字或满屏表情, 5: 格式一般, 8: 手机上一眼扫完，层次清楚, 10: 标题、分段、表情和 3 到 6 个话题标签都恰到好处，像平台上的高赞笔记}
  - name: call_to_action
    weight: 15
    question: 结尾是否让读者清楚知道下一步做什么，并有合理的紧迫感？
    anchors: {1: 没有行动指引, 5: 有指引但模糊, 8: 明确写出公众号回复「夜间」和前 50 名体验价, 10: 行动指引清楚且自然，读者会马上收藏或去回复，而不是被催促}

gates:
  min_chars: 200
  max_chars: 900
  must_include: ["129", "夜间"]
  must_not_include: ["最好", "第一", "100%", "顶级", "在这个快节奏的时代", "让我们一起"]
  regex_absent: ['\A[^\n]{21,}']   # 标题（第一行）不超过 20 个字

checks:
  - 笔记中出现的所有价格、时间、数量、设施和福利都与资料一致，没有资料之外的数字、评价或承诺。
  - 没有冒充真实用户的虚构经历或好评（可以用第二人称描述场景）。
