task: |
  A Xiaohongshu (RedNote) post promoting the Night Membership of "Night Voyage Study Room". The readers work or attend
  classes during the day and can only prepare for exams at night.
  A good post makes these people stop in their feed, believe it is real, and know exactly what to do next.
  judge/brief.md is the source of truth; any price, number, review or perk not in the brief counts as invented.

context: [judge/brief.md]   # frozen material given to the judges along with the post

criteria:
  - name: hook
    weight: 25
    question: Do the title and the first two lines make "people who can only study at night" stop scrolling?
    anchors: {1: an empty slogan or self-praise, 5: names the audience but paints no concrete picture, 8: a concrete scene in which target readers recognize themselves, 10: one line captures this group's real situation and worries, clearly more clickable in the feed than similar posts}
  - name: concrete_value
    weight: 25
    question: Does it use the brief's concrete details (hours, price, booth facilities, night perk, safety) to answer "what's in it for me"?
    anchors: {1: adjectives only, 5: lists some details but reads like a manual, 8: details are organized around the reader's evening, 10: every detail answers one specific worry of this group, and the reader has no questions left}
  - name: credibility
    weight: 20
    question: Does it read like a real person sharing or like a hard-sell ad? Is there exaggeration, absolute claims or information not in the brief?
    anchors: {1: an obvious hard sell or invented facts, 5: mostly believable but with stock phrases, 8: restrained and sincere with almost no stock phrases, 10: reads like a genuine regular sharing it, with not a single filler line to cut}
  - name: platform_fit
    weight: 15
    question: Does it fit how people read on Xiaohongshu (RedNote) - short paragraphs, clear points, emoji and hashtags in moderation?
    anchors: {1: a wall of text or a screen full of emoji, 5: average formatting, 8: scannable at a glance on a phone with a clear structure, 10: title, paragraphs, emoji and 3 to 6 hashtags are all just right, like a top-liked post on the platform}
  - name: call_to_action
    weight: 15
    question: Does the ending make the next step clear, with a reasonable sense of urgency?
    anchors: {1: no call to action, 5: a call to action but vague, 8: clearly says to reply "NIGHT" to the official account and mentions the trial price for the first 50, 10: a clear and natural call to action that makes the reader save the post or reply right away without feeling pushed}

gates:
  min_chars: 600
  max_chars: 2200
  must_include: ["129", "NIGHT"]
  must_not_include: ["the best", "number one", "100%", "top-notch", "fast-paced world", "Let's all", "let's all"]
  regex_absent: ['\A[^\n]{61,}']   # the title (first line) is at most 60 characters

checks:
  - Every price, time, quantity, facility and perk in the post matches the brief, with no numbers, reviews or promises beyond it.
  - The post does not pose as a real customer with made-up experiences or reviews (describing a scene in the second person is fine).
