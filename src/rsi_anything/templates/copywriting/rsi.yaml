name: xiaohongshu-post
goal: |
  Rewrite post.md into a Xiaohongshu (RedNote) post that makes the target reader stop scrolling, save it and visit the study room.
  Every fact must come from judge/brief.md; never invent prices, addresses, perks or customer reviews.
artifact:
  - post.md
judge:
  type: rubric
  rubric: judge/rubric.yaml
  files: [judge]
  models: [auto]      # e.g. [cli:codex, deepseek:deepseek-chat]; auto = up to two models you already have
  samples: 1
  pairwise: true      # a higher score must also win head-to-head against the current best
agent:
  use: auto           # api + model works too, e.g. use: api, model: deepseek:deepseek-chat
  timeout: 600
budget:
  rounds: 6
  minutes: 60
  stagnation: 3
