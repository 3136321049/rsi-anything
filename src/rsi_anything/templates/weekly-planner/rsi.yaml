name: weekly-life-planner
goal: |
  Edit schedule.json to plan this week around the fixed work, commute and dinner times in judge/requirements.json.
  Every session must be conflict-free, within waking hours, match each task's length and allowed days, and no day may hold more than 240 minutes of activities.
  Schedule as many of the 14 sessions as possible, putting the higher-weight study, family time and exercise first, and fit the preferred times.
  Score = 70% weighted task coverage + 30% weighted preference coverage. Missing sessions cost points; repeating a task beyond its count is invalid.
  task is the task ID; day is 1..7 (Monday to Sunday); start/end use HH:MM. Improve the schedule each round from the judge's report.
artifact: [schedule.json]
outputs: [out]
judge:
  type: command
  run: "{python} judge/evaluate.py"
  files: [judge]
  timeout: 30
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 45
  stagnation: 3
  target: 100
