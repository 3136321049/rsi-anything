name: gpu-softmax-speed
goal: |
  On an authorized Linux NVIDIA GPU, optimize softmax(x) in candidate.py while passing the fixed numerical checks in judge/cases.json.
  The input is a contiguous 2-D CUDA float32/float16 tensor; the output must match the input's shape, device and dtype, and the input must not be modified.
  The score is the geometric mean of torch.softmax time divided by candidate time over the fixed performance cases; a change is kept only if it improves by at least 3%.
  You may change the Triton parallelization, launch parameters and implementation, but not the reference, the cases, the timing method or the inference module.
  The time of a small randomly initialized inference module before and after the swap is also reported, but the module speedup is listed separately and is not the operator speedup or a measure of serving performance.
  If the environment is unavailable, stop and report it; never pass off CPU or simulated numbers as GPU results.
artifact: [candidate.py]
outputs: [out]
judge:
  type: command
  run: "{python} judge/check.py"
  files: [judge]
  min_gain: 3%
  timeout: 300
agent:
  use: auto
  timeout: 900
budget:
  rounds: 6
  minutes: 90
  stagnation: 3
