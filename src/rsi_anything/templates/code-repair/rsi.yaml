name: expense-code-repair
goal: |
  Fix amount parsing, bill splitting and monthly per-category totals in expense.py so every fixed test in judge/test_expense.py passes.
  Amounts are stored as integer cents; when splitting, the first people each get one extra cent; refunds are negative; months match a valid YYYY-MM.
  Keep the public function signatures and return types; do not edit the tests or hard-code answers for the test inputs. Fix one class of root cause per round.
  The score is the fixed-test pass rate; only 100 means everything is fixed, and a partial pass is a valid starting point for the next round.
artifact: [expense.py]
outputs: [out]
judge:
  type: command
  run: "{python} judge/evaluate.py"
  files: [judge, example.py]
  timeout: 30
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 45
  stagnation: 3
  target: 100
