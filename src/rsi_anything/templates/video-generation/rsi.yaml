name: warm-morning-product-video
goal: |
  Following judge/brief.md, improve the prompt, negative and seed in generation.json to generate a real short video of a ceramic mug in morning light.
  Each round generates a new clip through Lightricks' official public Space; check whether the subject, setting, steam and composition of the result match the brief.
  Change only those three fields, not the generation service, size or duration. The jury sees only sampled still frames, which cannot prove full motion or audio quality.
artifact: [generation.json]
judge:
  type: rubric
  prepare: "{python} judge/prepare.py"
  rubric: judge/rubric.yaml
  files: [judge]
  inputs: [out/video.mp4]
  models: [auto]
  pairwise: false
  timeout: 900
outputs: [out]
agent: {use: auto, timeout: 600}
budget: {rounds: 5, minutes: 90, stagnation: 3}
