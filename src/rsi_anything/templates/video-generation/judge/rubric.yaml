task: |
  Look at the attached still frames of the generated video and judge how well the visible image actually meets the brief for a ceramic mug in morning light.
  Judge only what the still frames can support. Do not assume the image meets the requirements because of the prompt, the model name, the score target or metadata.
  Do not judge sound, and do not claim the still frames prove continuous motion; if the steam is not visible, say so.
context: [judge/brief.md]
criteria:
  - name: subject
    weight: 30
    question: Is a complete light off-white ceramic mug clearly visible, with believable material, natural proportions and a prominent place in the frame?
    anchors: {1: subject missing or clearly the wrong object, 5: a mug is there but its color, material or structure is off, 8: a complete, natural mug that stands out, 10: subject and material details are both clear and restrained}
  - name: setting
    weight: 25
    question: Do the wooden table, side-window morning light and simple background form one quiet, warm setting?
    anchors: {1: setting does not match, 5: some elements are in place but the light is messy, 8: a clear, unified scene, 10: light and background together strengthen the product feel}
  - name: steam
    weight: 20
    question: Can natural, faint steam be seen in the still frames, rather than thick smoke, occlusion or distortion?
    anchors: {1: not visible or clearly abnormal, 5: visible but stiff, 8: faint, natural and not covering the subject, 10: steam works well with the light and no sampled frame shows obvious problems}
  - name: composition
    weight: 25
    question: Are the subject placement, negative space, background depth and overall cleanliness of the image right for a product mood clip?
    anchors: {1: cluttered or badly cropped, 5: usable but ordinary, 8: focused and natural composition, 10: every still frame keeps a clear subject and a consistent mood}
gates: {min_chars: 0}
checks:
  - The still frames show no obvious faces, brand logos, watermarks or extra text.
  - The subject shows no obvious breakage, duplicated mug handles or severe geometric deformation.
