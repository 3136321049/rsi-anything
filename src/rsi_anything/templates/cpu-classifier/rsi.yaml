name: cpu-digits-classifier
goal: |
  Edit training.json to raise accuracy on the fixed handwritten-digit validation split; read out/report.md and the mistake images to choose the next experiment.
  You may change the classifier and preprocessing: model is tree/knn/svm/random_forest, scaling is none/standard/minmax, pca_components is 0 or 2..64.
  The allowed parameters and ranges for each classifier are listed in README.md. The frozen data, split and scoring program must not be changed.
  One training and prediction run must finish within 30 seconds; the score is validation accuracy in percent, and a change is kept only if it gains at least 0.1 points.
  Test one well-reasoned parameter or model change per round; never hard-code answers for specific sample IDs.
artifact: [training.json]
outputs: [out]
judge:
  type: command
  run: "{python} judge/evaluate.py"
  files: [judge]
  min_delta: 0.1
  timeout: 120
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 45
  stagnation: 3
  target: 99.5
