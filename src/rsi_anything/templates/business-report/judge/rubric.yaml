task: |
  Write a concise analysis of Apple's historical operating results for product managers who are not used to reading financial statements. The focus is on understanding changes in the mix, which profit measure is which, and the limits of the data.
  Every number and statement comes only from the frozen data; the rendered numbers in placeholders are computed by a program. Judge the candidate's explanation, not the data table itself.
context: [judge/facts.json]
criteria:
  - name: main_point
    weight: 25
    question: Does a short opening state the most important operating change of the period, rather than only repeating numbers?
    anchors: {1: vague bullish or bearish talk, 5: all the numbers but no focus, 8: clearly explains how the total and the mix moved differently, 10: a sharp but restrained conclusion that points to the most telling evidence}
  - name: reasoning
    weight: 30
    question: Does it explain why products and services, and operating income and net income, must not be lumped together, and does it keep facts separate from inferences?
    anchors: {1: treats revenue as profit or invents causes, 5: notices the differences but explains them thinly, 8: a traceable chain of argument that handles the one-time tax charge correctly, 10: states precisely what can be concluded and what data is still missing}
  - name: chart_use
    weight: 20
    question: Do the chosen charts serve the main judgment of the text, and does the text explain what the reader should see in them?
    anchors: {1: charts unrelated to the text, 5: readable charts that only repeat the data, 8: chart choice tightly tied to the argument, 10: the fewest charts that clarify the relationship most easily misread}
  - name: readability
    weight: 15
    question: Can a non-finance reader understand it quickly? Are terms explained, and does every paragraph have a clear job?
    anchors: {1: hard to follow or full of filler, 5: readable but reads like a copied financial statement, 8: tight structure explained in plain language, 10: every paragraph helps the reader answer one specific question}
  - name: limits
    weight: 10
    question: Does it make clear that the data is historical, what data is missing, and what is uncertain about the future?
    anchors: {1: treats past changes as a guarantee of returns, 5: only generic risk warnings, 8: each limit is matched to a conclusion, 10: offers sensible things to watch next without posing as investment advice}
gates:
  min_chars: 900
  max_chars: 24000
checks:
  - Every company fact, number and causal attribution is supported by the given data; there are no share prices, price targets, buy or sell ratings, or promises of returns.
  - Quarterly figures are not presented as full-year figures, operating income is not treated as net income, and non-GAAP results do not replace GAAP results without saying so.
  - The charts agree with the conclusions in the text, and facts are clearly separated from analytical inferences.
