name: apple-operating-report
goal: |
  Improve the Apple fiscal 2024 operating analysis report.md and the chart configuration charts.json for product managers who are not used to reading financial statements.
  The only source material is judge/facts.json. Explain total revenue, the products and services mix, the different directions of operating income and net income, and the limits of the data.
  Write every number in the text as a {{data key}} placeholder; the keys are listed in judge/facts.json. Fiscal years can be written directly as 2023 and 2024.
  Cite sources as [S1], [S2]. Do not write about share prices, ratings or investment advice. Charts may only use metrics that exist in the data.
artifact: [report.md, charts.json]
judge:
  type: rubric
  prepare: "{python} judge/prepare.py"
  rubric: judge/rubric.yaml
  files: [judge]
  inputs: [out/evaluation.md]
  models: [auto]
  samples: 1
  pairwise: true
  timeout: 600
outputs: [out]
agent:
  use: auto
  timeout: 600
budget:
  rounds: 6
  minutes: 60
  stagnation: 3
