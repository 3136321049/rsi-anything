task: |
  A 40 to 75 second vertical short video cut from the given talk; the audience and goal are in the key points list.
  The first few seconds must tell viewers what is worth watching, and viewers should come away with a clear core message.
  The jury sees the sentences of the cut in playback order (one per line), plus the full original transcript and the key points list.
  The editor can only choose sentences from the original transcript and reorder them, so judge how well they were chosen and ordered, not how well the words themselves are written.

context: [judge/keypoints.md, judge/talk.txt]

criteria:
  - name: hook
    weight: 30
    question: Do the first and second sentences make a scrolling viewer stop?
    anchors: {1: opens with small talk or a self-introduction, 5: names the topic but flatly, 8: opens with a concrete conflict or contrast, 10: the first two sentences create strong curiosity or recognition that makes the viewer watch to the end}
  - name: coherence
    weight: 25
    question: With the middle sentences removed, does it still connect? Are there breaks such as unclear references, a "we'll get to that later" with no follow-up, or skipped numbering?
    anchors: {1: many breaks, hard to follow, 5: understandable but with obvious jumps, 8: mostly smooth with one small jump, 10: feels like it was always one complete short talk}
  - name: value
    weight: 25
    question: Compared with the key points list, how much of the core content does the viewer understand by the end?
    anchors: {1: no clear content, 5: one point but thinly explained, 8: explains the important information around the topic clearly, 10: complete, concrete information that suits a short-video audience}
  - name: ending
    weight: 10
    question: Does the ending wrap up the topic naturally rather than cutting off abruptly?
    anchors: {1: stops abruptly, 5: has an ending but a weak one, 10: the ending makes the viewer want to save it or act right away}
  - name: pacing
    weight: 10
    question: Are there sentences that waste time, such as small talk, overly long setup or repetition?
    anchors: {1: half of it is filler, 5: a few sentences could go, 10: every sentence moves things forward}

checks:
  - The cut has no sentence such as "we'll get to that later" or "the second point" that refers to content that was cut, unless the referenced content is also in the cut.
  - The editing does not make any method mean the opposite of, or distort, what the original talk said.
