name: talk-highlight
goal: |
  Cut a 40 to 75 second vertical highlight from a talk of about 4 minutes: someone scrolling past should want to stop within the first 3 seconds and come away with the core method.
  Edit only edit.json: use the sentence ids in judge/transcript.json to choose and order sentences from the original video; do not rewrite the content.
artifact:
  - edit.json
outputs: [out]
judge:
  type: rubric
  prepare: "{python} judge/render.py"   # renders out/cut.mp4 + out/cut.txt and checks duration and sentence count
  rubric: judge/rubric.yaml
  inputs: [out/cut.txt]                 # add out/cut.mp4 to let image-capable judges see sampled frames
  files: [judge]
  models: [auto]
  pairwise: true
assets: [assets]                        # the raw video (not committed); judges and the agent see it read-only
agent:
  use: auto
  timeout: 600
budget:
  rounds: 8
  minutes: 90
  stagnation: 3
