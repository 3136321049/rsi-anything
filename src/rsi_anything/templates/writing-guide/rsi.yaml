name: reusable-writing-guide
goal: |
  改进 writing-guide.md，让固定写手按照它为不同产品写出具体、有用、符合事实的小红书笔记。
  每轮只改手册，不改产品资料和评分。手册应该教会写手如何理解读者、选择开头、组织信息和给出自然的行动提示。
  评审会给出三个简报的实际生成稿；优先修复共性问题，不把某份简报的答案硬写进手册。
artifact: [writing-guide.md]
outputs: [out]
judge:
  type: rubric
  prepare: "{python} judge/generate.py development"
  rubric: judge/rubric.yaml
  inputs: [out/posts.md]
  files: [judge]
  models: [auto]
  pairwise: true
  timeout: 900
holdout:
  type: rubric
  prepare: "{python} judge/generate.py holdout"
  rubric: judge/rubric.yaml
  inputs: [out/posts.md]
  files: [holdout]
  models: [auto]
  pairwise: true
  timeout: 900
agent:
  use: auto
  timeout: 600
budget:
  rounds: 5
  minutes: 90
  stagnation: 4
