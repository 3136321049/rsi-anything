name: reusable-writing-guide
goal: |
  Improve writing-guide.md so that a fixed writer model following it produces specific, useful and factually accurate Xiaohongshu (RedNote) posts for different products.
  Each round, change only the guide, not the product briefs or the scoring. The guide should teach the writer how to understand the reader, choose an opening, organize information and give a natural call to action.
  The judge shows the actual drafts for all three briefs; fix shared problems first, and do not hard-code the answer for any single brief into the guide.
artifact: [writing-guide.md]
outputs: [out]
judge:
  type: rubric
  prepare: "{python} judge/generate.py development"
  rubric: judge/rubric.yaml
  inputs: [out/posts.md]
  files: [judge]
  models: [auto]
  pairwise: true
  timeout: 900
holdout:
  type: rubric
  prepare: "{python} judge/generate.py holdout"
  rubric: judge/rubric.yaml
  inputs: [out/posts.md]
  files: [holdout]
  models: [auto]
  pairwise: true
  timeout: 900
agent:
  use: auto
  timeout: 600
budget:
  rounds: 5
  minutes: 90
  stagnation: 4
