task: |
  Evaluate Xiaohongshu (RedNote) posts that one writing guide produced for several briefs. Each block gives the brief's facts and the generated draft.
  Judge only the generated drafts, and quote evidence from them. Weigh all drafts together: one especially good post must not hide clear problems in the others.
criteria:
  - name: reader_fit
    weight: 30
    question: Does each opening start from its target reader's specific situation rather than a generic ad?
    anchors: {1: "unrelated to the reader", 5: "the audience is recognizable but the scene is generic", 8: "several posts each capture a different, specific concern", 10: "every post is natural and specific and quickly gives a reason to keep reading"}
  - name: useful_structure
    weight: 30
    question: Can the reader quickly tell whether it suits them, how to use it and what the limits are?
    anchors: {1: "core information is missing", 5: "the information is mostly there but just listed", 8: "organized in the order a reader actually decides, and covers the limits", 10: "every post is concise and clear, and the details remove exactly the hesitation a reader would have"}
  - name: natural_voice
    weight: 25
    question: Is the writing natural and restrained, avoiding the same opening in every post and empty praise?
    anchors: {1: "stock phrases everywhere", 5: "readable but clearly templated", 8: "each brief gets its own voice without exaggeration", 10: "specific and vivid, with a steady tone and no repetition"}
  - name: action
    weight: 15
    question: Is the call to action clear, natural and consistent with the brief?
    anchors: {1: "no workable next step", 5: "a next step is given but feels forced", 8: "naturally connects the need to the next step", 10: "every ending is accurate, effortless and pressure-free"}
checks:
  - "The drafts invent no prices, times, spots, customer experiences or promised results beyond the brief."
  - "No draft uses the facts or call to action of one brief in another."
gates:
  min_chars: 1000
  max_chars: 18000
  degenerate: false
