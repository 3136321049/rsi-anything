name: cpu-digits-classifier
goal: '修改 training.json，提高固定划分的手写数字验证集正确率；观察 out/report.md 和错例图选择下一次实验。

  可改分类器和预处理：model 为 tree/knn/svm/random_forest，scaling 为 none/standard/minmax，pca_components
  为 0 或 2..64。

  各分类器允许参数及范围见 README.md。冻结的数据、划分、评分程序不能修改。

  一次训练与预测需在 30 秒内完成；得分为验证集正确率百分数，至少提高 0.1 分才保留。

  每轮优先测试一个有理由的参数或模型变化，不允许针对样本编号写死答案。

  '
artifact:
- training.json
outputs:
- out
judge:
  type: command
  run: '{python} judge/evaluate.py'
  files:
  - judge
  min_delta: 0.1
  timeout: 120
agent:
  use: codex
  timeout: 600
  model: gpt-6.1-sol
budget:
  rounds: 3
  minutes: 25.0
  stagnation: 3
