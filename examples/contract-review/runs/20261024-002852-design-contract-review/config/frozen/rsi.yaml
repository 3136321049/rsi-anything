name: design-contract-review
goal: '审阅 judge/contract.json 中完全虚构的设计服务合同，修改 review.json。

  依据 judge/review-guide.json 的七类检查项定位条款、引用原句、解释潜在争议并提出可执行的文字建议。

  不判断真实合同效力，不引入法条、判例或司法辖区；明确这是示例演练，不构成法律意见。

  issue_id 使用给定检查项编号，clause_id 使用合同条款编号；建议可以是供双方讨论的条款草案。

  '
artifact:
- review.json
judge:
  type: rubric
  prepare: '{python} judge/prepare.py'
  rubric: judge/rubric.yaml
  files:
  - judge
  inputs:
  - out/evaluation.md
  models:
  - cli:codex:gpt-6.1-sol
  pairwise: true
  timeout: 600
outputs:
- out
agent:
  use: codex
  timeout: 600
  model: gpt-6.1-sol
budget:
  rounds: 3
  minutes: 25.0
  stagnation: 3
