task: |
  根据给定合成合同和自拟检查指南梳理问题。高质量输出应让双方知道改哪句、为什么改、怎样形成明确约定。
  本例不判断法律效力，不提供真实法律意见。程序覆盖记录只确认条款定位，不代表建议质量。
context: [judge/contract.json, judge/review-guide.json]
criteria:
  - name: coverage
    weight: 30
    question: 七类预设问题覆盖了哪些？是否将关键争议完整说明而不只是列名称？
    anchors: {1: 只发现一两类且解释不清, 5: 覆盖约一半且有实质说明, 8: 基本覆盖七类并突出重要问题, 10: 完整覆盖且各类边界清楚无重复}
  - name: consequence
    weight: 25
    question: 每条风险是否紧扣原合同文字，说明会出现什么具体分歧？
    anchors: {1: 只有风险很大, 5: 解释泛泛但相关, 8: 清楚说明不同理解与实际后果, 10: 区分双方关切并指出最需要先确认的事项}
  - name: revision
    weight: 30
    question: 修改建议是否可执行，明确范围、触发条件、时间或处理方法，并标明未确认的数字？
    anchors: {1: 只写建议完善, 5: 有方向但仍留下关键歧义, 8: 具体可讨论且能解决原问题, 10: 条款草案完整克制且与其他条款协调}
  - name: presentation
    weight: 15
    question: 非法律专业读者能否迅速找到问题、原文和下一步？
    anchors: {1: 空泛术语多, 5: 可读但各条像重复模板, 8: 清楚简洁并有优先顺序, 10: 能直接作为双方讨论清单}
gates: {min_chars: 300, max_chars: 12000}
checks:
  - 没有杜撰法条、判例或司法辖区，没有断言合同必然无效、必然胜诉或某方已违法。
  - 引用对应真实给定条款，建议新增的时间和数字明确属于待双方确认的方案，而不是原合同事实。
  - 所提建议没有把乙方无法控制的第三方知识产权直接转让，也没有扩大客户资料任意使用范围。
