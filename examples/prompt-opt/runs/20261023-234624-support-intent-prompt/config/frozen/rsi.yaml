name: support-intent-prompt
goal: 'Improve prompt.md, the instructions a language model follows to label a customer
  message of a food-delivery

  app with exactly one intent. Score = accuracy (%) on the labeled examples in judge/dev.jsonl
  (48 messages, mixed Chinese and English).

  The prompt must work for any new message, so write general rules, not answers for
  specific examples.

  '
artifact:
- prompt.md
outputs:
- out
judge:
  type: command
  run: '{python} judge/evaluate.py judge/dev.jsonl'
  files:
  - judge
  direction: maximize
  min_delta: 2
  timeout: 1800
holdout:
  type: command
  run: '{python} judge/evaluate.py holdout/test.jsonl'
  files:
  - holdout
  timeout: 1800
agent:
  use: codex
  timeout: 900
  model: gpt-6.1-sol
budget:
  rounds: 3
  minutes: 30.0
  stagnation: 3
