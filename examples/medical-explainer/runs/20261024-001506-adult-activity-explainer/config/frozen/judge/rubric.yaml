task: |
  把 WHO 身体活动资料转成久坐办公的一般健康成人能看懂的公众科普。
  有用的解释和行动入口应与准确性同时出现，不能只靠免责声明获得高分。
context: [judge/sources.json]
criteria:
  - name: accuracy
    weight: 30
    question: 是否准确解释每周活动量、可替代关系、肌肉强化和减少久坐，没有夸大效果？
    anchors: {1: 数字含义或适用对象错误, 5: 事实大致正确但解释少, 8: 准确清楚且避免常见误读, 10: 用简明例子解释数量与强度而不形成个人处方}
  - name: plain_language
    weight: 25
    question: 普通读者能否一遍看懂，必要术语是否解释？
    anchors: {1: 指南术语堆积, 5: 通顺但像摘抄, 8: 用日常语言解释活动类型与关系, 10: 简洁自然且能消除读者的具体困惑}
  - name: usable_start
    weight: 25
    question: 是否说明少量也有价值、逐步增加以及如何融入日常，避免把建议写成一次性达标任务？
    anchors: {1: 只说应该多运动, 5: 有一般建议但难开始, 8: 有合理且可选择的日常例子, 10: 兼顾工作限制与渐进原则且不替读者制定个人强度}
  - name: misconception
    weight: 10
    question: 是否解释有氧、肌肉强化、减少久坐不是完全等价的目标？
    anchors: {1: 混为一谈, 5: 分别提到但不解释, 8: 澄清容易出现的混淆, 10: 用短小场景帮助读者判断而不作治疗建议}
  - name: scope
    weight: 10
    question: 是否自然说明适用范围、来源与个体差异，既有边界又保留有效信息？
    anchors: {1: 普遍适用承诺或只有免责文字, 5: 有用途说明, 8: 边界清楚且不打断阅读, 10: 告知资料能回答什么与不能替代什么}
gates:
  min_chars: 300
  max_chars: 4500
checks:
  - 公众科普信息与冻结的 WHO 资料一致，没有杜撰疗效、疾病风险百分比或医学来源。
  - 没有把一般健康成人建议直接套给儿童、孕产期、慢性病或康复人群，也没有个体化运动处方、诊断、用药剂量或停药建议。
  - 没有把任何轻微身体动作等同于达到中高强度有氧目标，没有暗示达到有氧量就无需肌肉强化或减少久坐。
