name: adult-activity-explainer
goal: '面向久坐办公的一般健康成人，改进 explainer.md，解释 WHO 身体活动建议，帮助读者理解并开始行动。

  只使用 judge/sources.json：中高强度有氧活动、肌肉强化、减少久坐、从少量逐步增加。

  关键数量必须通过 {{资料键}} 写入，资料键在 judge/sources.json 的 values 中；来源用 [W1]、[W2]。

  可以写一般生活场景例子，不制定个人训练处方，不加入药物、诊断或疾病治疗承诺。

  保留一般健康成人、健康科普及不能替代个体医疗建议的适用说明。

  '
artifact:
- explainer.md
judge:
  type: rubric
  prepare: '{python} judge/prepare.py'
  rubric: judge/rubric.yaml
  files:
  - judge
  inputs:
  - out/evaluation.md
  models:
  - cli:codex:gpt-6.1-sol
  samples: 1
  pairwise: true
  timeout: 600
outputs:
- out
agent:
  use: codex
  timeout: 600
  model: gpt-6.1-sol
budget:
  rounds: 3
  minutes: 25.0
  stagnation: 3
