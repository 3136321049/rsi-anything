task: |
  一条 40 到 75 秒的竖屏短视频，从给定口播中剪出，具体受众和目标见要点清单。
  前几秒要让观众知道值得看什么，看完能带走清楚的核心信息。
  评委看到的是成片按顺序播放的句子（每行一句），以及完整的原始讲稿和要点清单。
  只能从原讲稿里选句子、调顺序，所以要评的是"选得好不好、排得好不好"，不是文字本身写得好不好。

context: [judge/keypoints.md, judge/talk.txt]

criteria:
  - name: hook
    weight: 30
    question: 第一句和第二句能不能让刷到的人停下来？
    anchors: {1: 寒暄或自我介绍开场, 5: 点出了话题但平淡, 8: 用一个具体的冲突或反差开场, 10: 前两句就制造了强烈的好奇或共鸣，让人非看完不可}
  - name: coherence
    weight: 25
    question: 去掉中间的句子后，前后还接得上吗？有没有指代不明、说了"后面再说"却没有下文、编号跳号这类断裂？
    anchors: {1: 多处断裂，看不懂, 5: 能看懂但有明显跳跃, 8: 基本流畅，只有一处小跳跃, 10: 像原本就是一段完整的短讲}
  - name: value
    weight: 25
    question: 对照要点清单，观众看完能理解多少核心内容？
    anchors: {1: 没有明确内容, 5: 有一个要点但说明单薄, 8: 围绕主题把重要信息讲清楚, 10: 信息完整具体且适合短片受众}
  - name: ending
    weight: 10
    question: 结尾是否自然收束主题，而非突然截断？
    anchors: {1: 戛然而止, 5: 有结尾但无力, 10: 结尾让人想收藏或马上行动}
  - name: pacing
    weight: 10
    question: 有没有浪费时间的句子，比如寒暄、铺垫过长、重复？
    anchors: {1: 一半是废话, 5: 有几句可删, 10: 每一句都在推进}

checks:
  - 成片里没有"后面再说""第二点"这类引用了被剪掉内容的句子，或者被引用的内容也在成片里。
  - 成片没有因为剪辑而让某个方法的意思和原分享相反或被曲解。
