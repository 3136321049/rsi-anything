name: apple-operating-report
goal: '面向不熟悉财报的产品经理，改进 Apple 2024 财年经营分析报告 report.md 和图表配置 charts.json。

  资料只有 judge/facts.json。说明总营收、产品与服务结构、营业利润与净利润的不同走势、资料局限。

  正文数字用 {{资料键}} 插值，键见 judge/facts.json；财年可以直接写 2023、2024。

  引用使用 [S1]、[S2]。不要写股价、评级或投资建议。图表只能选择资料中现有指标。

  '
artifact:
- report.md
- charts.json
judge:
  type: rubric
  prepare: '{python} judge/prepare.py'
  rubric: judge/rubric.yaml
  files:
  - judge
  inputs:
  - out/evaluation.md
  models:
  - cli:codex:gpt-6.1-sol
  samples: 1
  pairwise: true
  timeout: 600
outputs:
- out
agent:
  use: codex
  timeout: 600
  model: gpt-6.1-sol
budget:
  rounds: 3
  minutes: 25.0
  stagnation: 3
