task: |
  给不熟悉财报的产品经理写一份简明的 Apple 历史经营分析。重点是看懂结构变化、利润口径和资料局限。
  所有数字与说明只来自冻结资料；已渲染的数字插值由程序计算。评价候选的解释，而非资料表本身。
context: [judge/facts.json]
criteria:
  - name: main_point
    weight: 25
    question: 能否用简短开头说明本期最值得关注的经营变化，而非只复述数字？
    anchors: {1: 空泛看好或看坏, 5: 数字齐全但没有重点, 8: 清楚解释总量与结构的不同走势, 10: 结论鲜明克制并指出最有解释力的证据}
  - name: reasoning
    weight: 30
    question: 是否解释产品与服务、营业利润与净利润为什么不能混为一谈，并把事实和推论分开？
    anchors: {1: 把营收等同利润或编造原因, 5: 注意到差异但解释很薄, 8: 形成可追踪的论据链并正确处理一次性税务费用, 10: 准确说明能推出什么和还缺什么数据}
  - name: chart_use
    weight: 20
    question: 选取的图表是否服务正文的主要判断，正文是否解释了读者应从图里看什么？
    anchors: {1: 图与正文无关, 5: 图能看但只是重复数据, 8: 图表选择与论点紧密相连, 10: 用最少图表澄清最容易误解的关系}
  - name: readability
    weight: 15
    question: 非金融读者能否快速理解，术语是否解释、段落是否有明确作用？
    anchors: {1: 难懂或空话很多, 5: 可读但像财报抄写, 8: 结构紧凑并用人话解释, 10: 每段都帮助读者回答一个具体问题}
  - name: limits
    weight: 10
    question: 是否把历史资料、缺少的数据和未来不确定性说明白？
    anchors: {1: 把过去变化当收益保证, 5: 只有泛泛风险提醒, 8: 局限与结论逐项对应, 10: 给出合理后续观察项且不伪装成投资建议}
gates:
  min_chars: 250
  max_chars: 6500
checks:
  - 所有公司事实、数字及因果归因均有给定资料支持；没有股价、目标价、买卖评级或收益承诺。
  - 没有把季度口径当成全年，没有把营业利润当成净利润，也没有用非GAAP结果替代GAAP而不说明。
  - 图表与正文结论一致，事实与分析推论有清楚区分。
