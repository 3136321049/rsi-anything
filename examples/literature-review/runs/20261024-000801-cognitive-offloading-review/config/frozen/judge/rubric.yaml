task: |
  为教育研究读书会组织三份给定资料，讨论数字工具怎样改变记忆内容与信息位置。
  评判是否形成有边界的综合分析，不把摘要逐篇重写视为高质量综述。
context: [judge/sources.json]
criteria:
  - name: question
    weight: 20
    question: 是否提出了清楚的问题和可讨论的中心判断？
    anchors: {1: 只有主题标签, 5: 问题存在但文章只是罗列, 8: 围绕明确问题组织全篇, 10: 判断有启发性且每段都推进问题}
  - name: synthesis
    weight: 30
    question: 是否比较资料之间的联系与差异，并用证据支持自己的综合判断？
    anchors: {1: 三段无联系的摘要, 5: 提到共同点但关系含糊, 8: 区分内容记忆与位置记忆并解释认知外包框架, 10: 从差异中提出有根据的新问题而没有夸大}
  - name: evidence
    weight: 25
    question: 是否区分实验发现、理论框架、政策建议和作者推论，引用是否支持相邻论断？
    anchors: {1: 引用装饰或证据错置, 5: 来源正确但边界模糊, 8: 每项重要论断都能找到对应资料与适用边界, 10: 主动解释不同证据不能相互替代的原因}
  - name: research_gap
    weight: 15
    question: 是否指出给定资料无法回答的问题，并提出可研究的后续问题？
    anchors: {1: 声称已经证明全部影响, 5: 只说还需更多研究, 8: 提出明确人群任务或比较条件, 10: 后续问题能区分几个竞争解释}
  - name: readability
    weight: 10
    question: 是否面向读书会解释概念，结构连贯且没有学术套话？
    anchors: {1: 堆术语, 5: 能读但转折生硬, 8: 概念有解释且段落衔接自然, 10: 精炼而有完整论证}
gates:
  min_chars: 300
  max_chars: 6000
checks:
  - 没有编造研究、实验数据、样本量、作者原话或给定摘要之外的结论。
  - 没有把早期检索和记忆实验当作现代生成式AI效果的直接证据。
  - 没有把政策建议当作实验结果；作者提出的教学建议或研究问题明确属于推论。
