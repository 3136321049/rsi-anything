name: reusable-writing-guide
goal: '改进 writing-guide.md，让固定写手按照它为不同产品写出具体、有用、符合事实的小红书笔记。

  每轮只改手册，不改产品资料和评分。手册应该教会写手如何理解读者、选择开头、组织信息和给出自然的行动提示。

  评审会给出三个简报的实际生成稿；优先修复共性问题，不把某份简报的答案硬写进手册。

  '
artifact:
- writing-guide.md
outputs:
- out
judge:
  type: rubric
  prepare: '{python} judge/generate.py development'
  rubric: judge/rubric.yaml
  inputs:
  - out/posts.md
  files:
  - judge
  models: &id001
  - cli:codex:gpt-6.1-sol
  pairwise: true
  timeout: 900
holdout:
  type: rubric
  prepare: '{python} judge/generate.py holdout'
  rubric: judge/rubric.yaml
  inputs:
  - out/posts.md
  files:
  - holdout
  models: *id001
  pairwise: true
  timeout: 900
agent:
  use: codex
  timeout: 600
  model: gpt-6.1-sol
budget:
  rounds: 5
  minutes: 60.0
  stagnation: 4
