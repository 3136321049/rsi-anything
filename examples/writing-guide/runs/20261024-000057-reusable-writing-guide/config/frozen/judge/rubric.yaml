task: |
  评价同一写作手册在多份简报上生成的小红书笔记。每个区块给出简报事实与生成稿。
  只评价生成稿，证据必须引用生成稿。综合所有稿件：不能靠某篇特别好掩盖其他稿件明显问题。
criteria:
  - name: reader_fit
    weight: 30
    question: 开头是否从各自目标读者的具体处境切入，而非通用广告？
    anchors: {1: "与读者无关", 5: "能看出人群但场景泛泛", 8: "多篇都抓住不同的具体顾虑", 10: "每篇都自然具体且迅速给出值得读下去的理由"}
  - name: useful_structure
    weight: 30
    question: 读者能否快速知道适不适合、怎么用、有哪些限制？
    anchors: {1: "缺少核心信息", 5: "信息基本齐但只是罗列", 8: "按实际决策顺序组织且照顾限制", 10: "每篇都简洁清楚，细节恰好消除犹豫"}
  - name: natural_voice
    weight: 25
    question: 表达是否自然克制，避免每篇同一套开头和空泛赞美？
    anchors: {1: "套话刷屏", 5: "可读但模板感较强", 8: "不同简报有各自表达且不夸张", 10: "具体鲜明、语气稳定又不雷同"}
  - name: action
    weight: 15
    question: 行动提示是否明确、自然且与简报一致？
    anchors: {1: "没有可行行动", 5: "有入口但生硬", 8: "自然串联需求与下一步", 10: "每篇结尾都准确、省事且不施压"}
checks:
  - "生成稿没有编造简报之外的价格、时间、名额、用户体验或效果承诺。"
  - "生成稿没有把某一份简报的事实或行动入口误用到另一份。"
gates:
  min_chars: 300
  max_chars: 6000
  degenerate: false
