name: percent-lesson
goal: '修改 lesson.md，为初中学生解释百分比、变化率、还原原量、连续变化和百分点的区别。

  可以调整结构、例题与逐步解释，遵循 judge/brief.md；不要逐题抄写 judge/exercises.json 的测试题答案。

  评分时受限学生模型只看到讲义和题目，需给答案、推理及讲义原句依据；程序按固定答案实际判分。

  '
artifact:
- lesson.md
judge:
  type: command
  run: '{python} judge/evaluate.py'
  files:
  - judge
  direction: maximize
  min_delta: 1
  timeout: 900
outputs:
- out
agent:
  use: codex
  timeout: 600
  model: gpt-6.1-sol
budget:
  rounds: 3
  minutes: 25.0
  stagnation: 3
